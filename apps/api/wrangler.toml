name = "tourenbuch-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Phase 7: Der Worker liefert auch die PWA aus (gleiche Origin wie die API,
# kein CORS-Thema). Vorher `pnpm --filter @tourenbuch/desktop build` laufen
# lassen. /api/* geht immer zuerst an den Worker, alles andere an die Assets;
# unbekannte Pfade fallen auf index.html zurück (SPA).
[assets]
directory = "../desktop/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/neon-auth/*"]

# Phase 8: R2-Bucket für die Bild-Ableitungen (content-addressed:
# images/<sha256>/<display|thumb>). Lokal simuliert `wrangler dev` den
# Bucket; produktiv zeigt das Binding auf den Bucket «topos».
[[r2_buckets]]
binding = "R2"
bucket_name = "topos"

[vars]
# Managed Better Auth (Neon Auth) – Basis-URL; JWKS unter /.well-known/jwks.json.
NEON_AUTH_URL = "https://ep-frosty-star-b2kyy6mv.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth"

# Secrets (nie hier eintragen!):
#   lokal:      apps/api/.dev.vars  (DATABASE_URL, API_TOKEN)
#   Produktion: wrangler secret put DATABASE_URL / API_TOKEN
#
# Phase 8: R2-Bucket-Binding kommt hier dazu.
